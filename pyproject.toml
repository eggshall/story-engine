[project]
name = "story-engine"
version = "0.8.0"
description = "AI 小说生成系统 — 故事引擎 (Story Engine)"
requires-python = ">=3.11"
authors = [
    { name = "Story Engine Developer" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "sse-starlette>=1.8",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
story = "story_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/story_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=story_engine --cov-report=term-missing --cov-fail-under=75"
filterwarnings = [
    # starlette 1.3.x 在未安装 httpx2 时对 testclient 的迁移提示，暂时无法消除（httpx2 尚未发布）
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["story_engine"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
